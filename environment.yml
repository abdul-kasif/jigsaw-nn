name: ml_env

channels:
  - pytorch
  - nvidia
  - conda-forge

dependencies:
  - python=3.11

  # Deep Learning
  - pytorch
  - pytorch-cuda

  # Data Processing
  - numpy
  - pandas
  - scipy

  # Classical Machine Learning
  - scikit-learn

  # Visualization
  - matplotlib
  - seaborn

  # Development
  - jupyterlab
  - ipykernel
  - tqdm

  # Utilities
  - pyyaml
